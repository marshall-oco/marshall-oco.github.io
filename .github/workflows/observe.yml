name: observe
# The observatory observes what its mark says it gathers - their tables, and what has run there - into
# data/, and lays the fulldome out on the page: every lens, in focus, over what was observed.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Observe only this part (runs): the lab asks for what has run every quarter hour"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: observe
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ocoeco taken from its release, checked against its sums: seconds, where building it took minutes
      - name: ocoeco, from its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ocoeco" "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/ocoeco"
          # the newest release that has its files: a release is made, and its files are built after it -
          # for those minutes the newest has nothing to take, and the one before it serves
          tag=$(gh api repos/open-commons-observatory/ocoeco/releases --jq '[.[] | select(any(.assets[]; .name | endswith("x86_64-unknown-linux-musl.tar.gz")) and any(.assets[]; .name == "SHA256SUMS-x86_64-unknown-linux-musl"))][0].tag_name')
          gh release download "$tag" --repo open-commons-observatory/ocoeco --pattern "ocoeco-v*-x86_64-unknown-linux-musl.tar.gz" --pattern "SHA256SUMS-x86_64-unknown-linux-musl"
          sha256sum -c --ignore-missing SHA256SUMS-x86_64-unknown-linux-musl
          tar -xzf ocoeco-v*-x86_64-unknown-linux-musl.tar.gz
          install -m 755 "$(find . -name ocoeco -type f | head -1)" "$RUNNER_TEMP/bin/ocoeco"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: observe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: |
          # Everything is observed by holding: each place this observatory gathers is brought to hand, as it
          # is on GitHub now, and read as any place held is read - its tables, those it keeps on another
          # branch, and what the routes read. What has run alone, which the lab asks for every quarter hour,
          # is asked of GitHub.
          if [ -n "$ONLY" ]; then
            ocoeco observe --out data --only "$ONLY"
          else
            ocoeco observe --hold "$RUNNER_TEMP/held" --out data
          fi
      - name: commit what changed
        run: |
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          # the name is the repository's, not one command's: a rebase after a collision signs its commit too
          git config user.name "oco observe"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: observed"
          for try in 1 2 3 4 5; do
            git push && exit 0
            echo "main moved while observing (try $try): rebasing what was observed onto it"
            # observed whole each time, and this observation is the later one: its own data wins
            git pull --rebase -q -X theirs origin main
          done
          echo "could not push what was observed after five tries"; exit 1
      # the pages are laid out where the whole was observed: an observing of one part only - what has run,
      # asked for every quarter hour - keeps what it observed and leaves the pages as they are
      - name: the engine lenses focus with (DuckDB, pinned by fingerprint - the one tad checks and installs)
        if: ${{ inputs.only == '' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          echo "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  $RUNNER_TEMP/duckdb.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/duckdb" && unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
      - name: the fulldome, on the page
        if: ${{ inputs.only == '' }}
        run: |
          mkdir -p _site
          # the site is said by a lens of this place: its rows are the pages - the whole, and a page for
          # each place in view - each laid out by the page lens; a line about a place leads to its page
          ocoeco site site --observed data --out _site
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.only == '' }}
        with:
          path: _site
  publish:
    needs: observe
    if: ${{ inputs.only == '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
