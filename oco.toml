# This repository's mark: how it fits the Open Commons Observatory's picture.
schema = 1

[project]
id = "marshall-oco/marshall-oco.github.io"
name = "Marshall's observatory: every constellation and star he tends, as one sky"
title = "Marshall's observatory"
kind = "observatory"
parent = "marshall-oco"

[exports]
backlog = "oco/backlog.json"
# what has run in every place it gathers: observed, never written by hand
runs = "data/runs.json"
milestones = "oco/milestones.json"
session_log = "oco/session_log.json"
problems = "oco/problems.json"
decisions = "oco/decisions.json"
glimpses = "oco/glimpses.json"
lens_parts = "oco/lens_parts.json"
lenses = "oco/lenses.json"
activity = "oco/gathered/activity.json@oco-data"
releases = "oco/gathered/releases.json@oco-data"
ci = "oco/gathered/ci.json@oco-data"

# What place this is, and what it gathers: a star by name, or every star of an owner (owner/*).
[place]
is = "observatory"
gathers = ["open-commons-observatory/*", "creation-guidelines/*", "linux-phone-oco/*", "linux-package-distribution-oco/*", "Mnemonic-Vocabulary-org/*", "rhizome-oco/*", "git-rhizoid/*", "argenv-opencommons/*", "marshall-oco/*"]
